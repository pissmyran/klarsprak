# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  path_instructions:
    - path: "src/worker.js"
      instructions: |
        When admin handlers change, check that every read and
        mutation requires a valid Bearer token and denies access when ADMIN_TOKEN is missing.
        When submission changes, check that Turnstile is verified on the server
        with success, action term_submit and an allowed hostname before the database insert.
        Network errors or a missing Turnstile configuration must never accept a submission.
        Check that submitter_ip only gets an HMAC identity, never the raw IP.
        Keep RATE_LIMIT_KEY with ADMIN_TOKEN as fallback, and the error response when an IP exists
        but no key does. When rate limiting changes, review the time format,
        time windows and concurrent submissions; do not assume that a separate COUNT and INSERT
        give an atomic limit.
        When publishing changes, check that submissions stay a review queue
        and that /api/terms only returns published published_terms without internal
        notes or submitter data. Check required source fields,
        length limits and http/https for source URLs.
        Check that approval and publishing succeed or roll back together.
        Review concurrent approve/reject and repeated calls against pending conditions,
        unique indexes and the number of changed rows, not just a preceding SELECT.
        When D1 routes change, check the session choice: admin reads and mutations
        start on first-primary; public term reads use first-unconstrained.

    - path: "{src/index.js,src/response-policy.js,wrangler.jsonc}"
      instructions: |
        When routing or the Assets configuration changes, check that the Worker
        runs before static files. /admin must reach Assets without a rewrite to
        /admin.html. /admin/api/ is rewritten internally to /api/admin/, and direct
        internal calls are redirected to the public admin path.
        Check that rewrites keep the method, body, query and Authorization.
        When responses change, check no-store on admin paths, also for errors and
        redirects, and that public responses keep their intended cache policy.
        When the CSP or HTML rewriting changes, check that the documentation's
        inline scripts get the same nonce as the response's CSP and that Turnstile is still
        allowed without opening script-src with unsafe-inline.
        When host names change, check that IDN aliases are compared as punycode and
        redirected to PUBLIC_HOST with the path and query kept.

    - path: "public/{app,admin}.js"
      instructions: |
        When rendering of API data changes, check escaping in HTML text,
        attributes and textarea, and that source link protocols are validated in the server flow.
        When admin calls change, check the /admin/api/ paths and the Bearer header.
        The token must never end up in a URL, logs or publicly rendered content.
        When the suggestion form changes, check the mapping from cf-turnstile-response
        to turnstileToken and that the client never shows publishing as successful
        before the server's review flow has approved the entry.

    - path: "public/{service-worker,pwa}.js"
      instructions: |
        When the service worker or its scope changes, check that admin content,
        token-carrying calls and mutations are never stored or replayed.
        The current service worker is network-only. If a cache is introduced, check
        explicitly which public data may be stored, how it becomes current after
        archiving and that no-store is not bypassed.
        Check that registration only happens in a secure context.

    - path: "migrations/*.sql"
      instructions: |
        On schema changes, check D1/SQLite compatibility and upgrading
        with existing submissions and published_terms. Keep the unique submission_id,
        unique LOWER(TRIM(term)), status conditions and affected runtime queries.
        Check the migration order and data loss on table or column changes.
        Container start applies migrations before server start; do not assume the opposite order.
        On data changes, check that seeding, requeuing and archiving never
        republish previously archived entries or delete review history.
        Check that new or changed published entries have separate linguistic
        and institutional sources that support the claimed difference in meaning.
        Keep the cleanup of historical raw submitter_ip values.

    - path: "{tools/render.mjs,cloudflare.example.env}"
      instructions: |
        When placeholders change, check that they are declared in cloudflare.example.env
        and replaced in the intended runtime files. Missing values must fail; intentionally
        empty values must work, including removal of an empty alias route.
        When copying, overlay or substitution changes, check that the output
        can never delete the source tree, be copied recursively into itself or follow
        links to private files when writing.
        Check that private value files and Worker secrets never end up
        in public, the image, published artifacts or logs.

    - path: "{Dockerfile,docker-compose.yml,package.json,bun.lock,docker/entrypoint.sh,docker/import-settings.sh,docker/wrangler.jsonc}"
      instructions: |
        When the runtime or dependencies change, check Node, Wrangler and workerd
        together with the commands in docker/entrypoint.sh. Docker installs with
        npm from package.json, not from bun.lock; do not assume the lockfile controls the image.
        Check that src, public, migrations, the renderer and the container configuration
        are in the image, that the process runs as non-root and that /data and /srv are writable.
        When start or storage changes, check that migration and server use
        the same persistent /data and that an upgrade never replaces existing D1 data.
        Local use must use the local DB configuration without a Cloudflare account.
        When settings import changes, check that NAME=value is treated as data,
        that later import values win, that empty import values remove saved values
        and that non-empty environment variables take precedence.
        Check private file permissions for saved settings and the env file
        with ADMIN_TOKEN and TURNSTILE_SECRET. Secrets must never be built into the image.

    - path: ".github/workflows/{release,docker}.yml"
      instructions: |
        When the release chain changes, check the link between the package.json version,
        the v tag, CHANGELOG.md and the Docker tags X.Y.Z, X.Y, X and latest.
        Check that Docker publishing still starts after a release is created
        and can run separately for recovery when the tag already exists.
        When retries or concurrency groups change, check that an older
        release never accidentally overwrites a newer latest or major/minor tag.
